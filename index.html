<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Crossbar Clash</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#071018;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}.ui{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}.brand{font-weight:900;letter-spacing:2px;font-size:20px;text-shadow:0 3px 10px #000}.pill{background:#08121dcc;border:1px solid #ffffff25;border-radius:999px;padding:8px 12px;font-weight:800}.bottom{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:9px}.hint{background:#071018cc;border:1px solid #ffffff22;padding:8px 13px;border-radius:999px;font-weight:700;font-size:13px}.meter{width:min(430px,88vw);height:14px;border-radius:20px;background:#ffffff18;border:1px solid #ffffff22;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#27e06f,#ffe04a,#ff5d5d);border-radius:20px}.start{pointer-events:auto;border:0;border-radius:14px;padding:14px 28px;background:#fff;color:#061018;font-weight:950;font-size:17px;box-shadow:0 8px 24px #0007}.modal{position:absolute;inset:0;display:grid;place-items:center;background:#0008;pointer-events:auto}.card{width:min(440px,90vw);padding:24px;border-radius:24px;background:linear-gradient(160deg,#142330,#081018);border:1px solid #ffffff22;box-shadow:0 25px 80px #000b;text-align:center}.card h1{font-size:38px;margin:0 0 4px;letter-spacing:2px}.card h2{margin:0 0 12px;color:#8ff7b1}.card p{color:#c6d2da;line-height:1.5}.hidden{display:none}.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.flash.hit{animation:hit .38s ease-out}@keyframes hit{0%{opacity:.8}100%{opacity:0}}
</style></head><body><canvas id="game"></canvas><div class="ui"><div class="top"><div class="brand">CROSSBAR CLASH</div><div class="pill">SCORE <span id="score">0</span></div><div class="pill">BEST <span id="best">0</span></div></div><div class="bottom"><div class="hint" id="hint">Drag from the ball toward the crossbar • release to shoot</div><div class="meter"><div class="fill" id="power"></div></div></div><div class="flash" id="flash"></div><div class="modal" id="menu"><div class="card"><h1>CROSSBAR</h1><h2>CLASH</h2><p>Take the shot. Smash the bar. Build your streak.</p><p><b>JACK23</b> is stepping up.</p><button class="start" id="play">KICK OFF</button></div></div></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),powerEl=document.getElementById('power'),hint=document.getElementById('hint'),menu=document.getElementById('menu'),play=document.getElementById('play'),flash=document.getElementById('flash');
let W,H,dpr=1,playing=false,score=0,best=Number(localStorage.getItem('ccbest')||0),streak=0,shots=0,aim=null,ball={x:0,y:0,r:18,vx:0,vy:0,spin:0,active:false,t:0},particles=[],textFx=[],last=0,goal={x:0,y:0,w:0,h:0,bar:0};bestEl.textContent=best;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);goal.w=Math.min(W*.62,430);goal.h=goal.w*.48;goal.x=W/2-goal.w/2;goal.y=H*.23;goal.bar=goal.y+goal.h*.2;resetBall()} addEventListener('resize',resize);
function resetBall(){ball={x:W/2,y:H*.79,r:Math.max(13,Math.min(19,W*.035)),vx:0,vy:0,spin:0,active:false,t:0};aim=null}
function sky(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#07111c');g.addColorStop(.48,'#163348');g.addColorStop(.7,'#315a67');g.addColorStop(1,'#102f20');x.fillStyle=g;x.fillRect(0,0,W,H)}
function stadium(){sky();let horizon=H*.46;x.fillStyle='#101820';x.fillRect(0,horizon,W,H*.22);for(let r=0;r<8;r++){x.fillStyle=r%2?'#192631':'#22303a';x.fillRect(0,horizon+r*15,W,15)}for(let i=0;i<230;i++){let px=(i*83)%W,py=horizon+8+((i*37)%90);x.fillStyle=i%3?'#d7dfe4':'#7fd1ff';x.globalAlpha=.35;x.fillRect(px,py,2,2)}x.globalAlpha=1;[[W*.12,H*.13],[W*.88,H*.13]].forEach(p=>{let lg=x.createRadialGradient(p[0],p[1],2,p[0],p[1],90);lg.addColorStop(0,'#fff',);lg.addColorStop(1,'#fff0');x.fillStyle=lg;x.beginPath();x.arc(p[0],p[1],90,0,7);x.fill();x.fillStyle='#eaf5ff';x.fillRect(p[0]-18,p[1]-4,36,8)});let g=x.createLinearGradient(0,horizon,0,H);g.addColorStop(0,'#4d9c52');g.addColorStop(1,'#12351e');x.fillStyle=g;x.fillRect(0,horizon,W,H-horizon);for(let i=0;i<10;i++){x.fillStyle=i%2?'#ffffff0b':'#0000000b';x.fillRect(i*W/10,horizon,W/20,H-horizon)} }
function goalDraw(){let gx=goal.x,gy=goal.y,gw=goal.w,gh=goal.h; x.save();x.strokeStyle='#ffffff24';x.lineWidth=1;for(let i=0;i<=12;i++){let xx=gx+gw*i/12;x.beginPath();x.moveTo(xx,gy);x.lineTo(gx+gw/2+(xx-gx-gw/2)*.82,gy+gh);x.stroke()}for(let i=0;i<=8;i++){let yy=gy+gh*i/8;x.beginPath();x.moveTo(gx,yy);x.lineTo(gx+gw,yy);x.stroke()}x.strokeStyle='#f5f7f8';x.lineWidth=Math.max(6,W*.012);x.beginPath();x.moveTo(gx,gy+gh);x.lineTo(gx,gy);x.lineTo(gx+gw,gy);x.lineTo(gx+gw,gy+gh);x.stroke();x.strokeStyle='#9ca8ae';x.lineWidth=2;x.strokeRect(gx+8,gy+8,gw-16,gh-8);x.restore()}
function player(){let px=W/2,py=H*.72,s=Math.min(W,H)/650;x.save();x.translate(px,py);x.scale(s,s); // shadow
x.fillStyle='#0008';x.beginPath();x.ellipse(0,105,65,13,0,0,7);x.fill(); // legs
x.fillStyle='#111820';x.fillRect(-29,35,25,67);x.fillRect(4,35,25,67);x.fillStyle='#fff';x.fillRect(-31,92,31,11);x.fillRect(2,92,31,11); // shorts
x.fillStyle='#121b26';x.fillRect(-40,12,80,45); // shirt
let kit=x.createLinearGradient(-45,-45,45,50);kit.addColorStop(0,'#e9edf1');kit.addColorStop(.45,'#a9b8c5');kit.addColorStop(1,'#334657');x.fillStyle=kit;x.beginPath();x.roundRect(-46,-54,92,80,12);x.fill(); // arms
x.strokeStyle='#b88769';x.lineWidth=15;x.lineCap='round';x.beginPath();x.moveTo(-39,-39);x.lineTo(-58,18);x.moveTo(39,-39);x.lineTo(58,18);x.stroke(); // neck/head
x.fillStyle='#b88769';x.fillRect(-13,-70,26,20);x.beginPath();x.arc(0,-91,25,0,7);x.fill(); // hair
x.fillStyle='#1c1a19';x.beginPath();x.arc(0,-99,26,3.2,6.2);x.fill(); // name
x.fillStyle='#17222c';x.textAlign='center';x.font='bold 11px system-ui';x.fillText('JACK23',0,-18);x.font='900 34px system-ui';x.fillText('23',0,10); // boots
x.fillStyle='#111';x.fillRect(-35,100,35,8);x.fillRect(2,100,35,8);x.restore()}
function ballDraw(){let b=ball;x.save();let grd=x.createRadialGradient(b.x-b.r*.35,b.y-b.r*.45,2,b.x,b.y,b.r);grd.addColorStop(0,'#fff');grd.addColorStop(.65,'#e8eef1');grd.addColorStop(1,'#87939a');x.fillStyle=grd;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();x.strokeStyle='#27333b';x.lineWidth=1;x.stroke();x.fillStyle='#27333b';for(let i=0;i<5;i++){let a=i*1.256+b.spin;x.beginPath();x.arc(b.x+Math.cos(a)*b.r*.42,b.y+Math.sin(a)*b.r*.42,b.r*.18,0,7);x.fill()}x.restore()}
function fx(text,color='#fff'){textFx.push({text,x:ball.x,y:ball.y-30,a:1,vy:-1.4,color})}
function particlesAt(px,py,n,color){for(let i=0;i<n;i++){let a=Math.random()*7,s=2+Math.random()*7;particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,r:2+Math.random()*3,a:1,color})}}
function shoot(dx,dy){let power=Math.min(1.15,Math.hypot(dx,dy)/180);let targetX=ball.x+dx*1.25,targetY=ball.y+dy*1.25;let tx=Math.max(goal.x-20,Math.min(goal.x+goal.w+20,targetX));let ty=Math.max(goal.y-20,Math.min(goal.y+goal.h*.8,targetY));ball.vx=(tx-ball.x)*.027*power;ball.vy=-Math.abs((ball.y-ty)*.028)*power-3.5*power;ball.active=true;ball.t=0;hint.textContent='Watch it…';powerEl.style.width='0%'}
function update(dt){if(ball.active){ball.t+=dt;ball.vy+=10*dt;ball.x+=ball.vx*dt*60;ball.y+=ball.vy*dt*60;ball.spin+=.25; if(ball.t>.12 && ball.y<=goal.bar+10 && ball.y>=goal.bar-18 && ball.x>goal.x-8 && ball.x<goal.x+goal.w+8){let center=goal.x+goal.w/2,dist=Math.abs(ball.x-center)/(goal.w/2);let pts=dist<.18?100:75;score+=pts;streak++;shots++;scoreEl.textContent=score;fx(dist<.18?'PERFECT!':'CROSSBAR!',dist<.18?'#ffe66d':'#8ff7b1');particlesAt(ball.x,goal.bar,34,'#ffffff');flash.classList.remove('hit');void flash.offsetWidth;flash.classList.add('hit');hint.textContent=`${pts} POINTS • STREAK x${streak}`;ball.active=false;setTimeout(resetBall,650)}else if(ball.t>.12 && ball.y<goal.y+goal.h && ball.y>goal.y && ball.x>goal.x && ball.x<goal.x+goal.w){score+=25;streak=0;shots++;scoreEl.textContent=score;fx('GOAL!','#7dd3fc');particlesAt(ball.x,ball.y,20,'#7dd3fc');hint.textContent='Goal — but the bar is worth more!';ball.active=false;setTimeout(resetBall,650)}else if(ball.y>H*.84){shots++;streak=0;fx('MISS','#ff9c9c');hint.textContent='Miss. Try again.';ball.active=false;setTimeout(resetBall,650)}}particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.a-=dt*2});particles=particles.filter(p=>p.a>0);textFx.forEach(t=>{t.y+=t.vy;t.a-=dt});textFx=textFx.filter(t=>t.a>0)}
function draw(){stadium();goalDraw();player();if(aim&&!ball.active){x.save();x.strokeStyle='#ffffff99';x.lineWidth=3;x.setLineDash([7,7]);x.beginPath();x.moveTo(ball.x,ball.y);x.lineTo(aim.x,aim.y);x.stroke();x.setLineDash([]);x.fillStyle='#fff';x.beginPath();x.arc(aim.x,aim.y,7,0,7);x.fill();x.restore()}ballDraw();particles.forEach(p=>{x.globalAlpha=p.a;x.fillStyle=p.color;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();x.globalAlpha=1});textFx.forEach(t=>{x.globalAlpha=t.a;x.fillStyle=t.color;x.textAlign='center';x.font='900 24px system-ui';x.fillText(t.text,t.x,t.y);x.globalAlpha=1})}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;if(playing)update(dt);draw();requestAnimationFrame(loop)}
function pos(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
c.addEventListener('pointerdown',e=>{if(!playing||ball.active)return;let p=pos(e);if(Math.hypot(p.x-ball.x,p.y-ball.y)<80){aim=p;c.setPointerCapture(e.pointerId)}});c.addEventListener('pointermove',e=>{if(!aim||ball.active)return;aim=pos(e);let pow=Math.min(100,Math.max(0,Math.hypot(aim.x-ball.x,aim.y-ball.y)/2));powerEl.style.width=pow+'%'});c.addEventListener('pointerup',e=>{if(!aim||ball.active)return;let p=pos(e),dx=p.x-ball.x,dy=p.y-ball.y;if(dy>-20){hint.textContent='Swipe upward toward the crossbar';aim=null;powerEl.style.width='0%';return}shoot(dx,dy);aim=null});
play.addEventListener('click',()=>{playing=true;score=0;streak=0;shots=0;scoreEl.textContent=0;menu.classList.add('hidden');hint.textContent='Drag from the ball toward the crossbar • release to shoot';resetBall()});resize();requestAnimationFrame(loop);
</script></body></html>
